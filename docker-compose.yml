services:
  postgres:
    image: postgres:16-alpine
    container_name: campuscare-postgres
    environment:
      POSTGRES_DB: campuscare
      POSTGRES_USER: campuscare
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-campuscare_dev}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U campuscare -d campuscare"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - campuscare-network
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: campuscare-backend
    environment:
      DATABASE_URL: postgresql+psycopg://campuscare:${POSTGRES_PASSWORD:-campuscare_dev}@postgres:5432/campuscare
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-campuscare-dev-secret-change-before-production}
      JWT_ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: 60
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - campuscare-network
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: campuscare-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks:
      - campuscare-network
    restart: unless-stopped

networks:
  campuscare-network:
    driver: bridge

volumes:
  postgres_data:
